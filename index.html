<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HeartResonance</title>
    <meta name="description" content="HeartResonance 安装包下载。" />
    <meta name="theme-color" content="#f4fbf8" />

    <!-- 分享预览 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HeartResonance" />
    <meta property="og:description" content="HeartResonance 安装包下载。" />
    <meta property="og:url" content="https://saya.eris.studio/" />

    <!-- 内联 favicon：与按钮里的脉冲点同一意象，零请求 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23a7f3d0'/%3E%3C/svg%3E"
    />

    <style>
      :root {
        color-scheme: light;
        --bg: #f4fbf8;
        --fg: #0e1f1c;
        --muted: #52635f;
        --faint: #63736f;
        --line: rgba(14, 60, 52, 0.12);
        --accent: #0b7a6a;
        --accent-hi: #0f766e;
        --accent-lo: #0369a1;
        --cta-fg: #ffffff;
        --r-card: 28px;
        --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        display: grid;
        place-items: center;
        -webkit-font-smoothing: antialiased;
      }

      /* 背景光斑：缓慢漂移，26s 一个来回 */
      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 60vmax;
        height: 60vmax;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.42;
        pointer-events: none;
        z-index: 0;
        animation: drift 26s ease-in-out infinite alternate;
      }

      body::before {
        background: #5eead4;
        top: -30vmax;
        left: -20vmax;
      }

      body::after {
        background: #93c5fd;
        bottom: -35vmax;
        right: -20vmax;
        animation-delay: -13s;
      }

      main {
        position: relative;
        z-index: 1;
        width: min(560px, 100%);
        padding: 56px 32px 40px;
        text-align: center;
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(18px);
        box-shadow: 0 24px 60px rgba(12, 74, 64, 0.1);
      }

      .mark {
        margin: 0 0 28px;
        color: var(--accent);
        font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(30px, 6vw, 44px);
        line-height: 1.2;
        letter-spacing: -0.03em;
      }

      /* ── 简介 ─────────────────────────────────── */
      .about {
        margin: 0 auto;
        padding-left: 14px;
        max-width: 40em;
        border-left: 2px solid rgba(15, 118, 110, 0.22);
        text-align: left;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.95;
        letter-spacing: 0.01em;
      }

      /* ── 主按钮组 ─────────────────────────────── */
      .cta-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin: 34px auto 0;
      }

      .cta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        width: min(320px, 100%);
        margin: 0;
        padding: 15px 28px;
        border: 1px solid transparent;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--accent-hi), var(--accent-lo));
        color: var(--cta-fg);
        text-decoration: none;
        box-shadow: 0 10px 26px rgba(15, 118, 110, 0.25);
        transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease),
          filter 0.18s var(--ease);
      }

      .cta-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .cta-meta {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.05em;
        opacity: 0.88;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--cta-fg);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.55);
        animation: pulse 2.4s ease-in-out infinite;
      }

      .cta:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 38px rgba(15, 118, 110, 0.32);
        filter: brightness(1.04);
      }

      .cta:active {
        transform: translateY(0) scale(0.99);
      }

      .cta:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      /* 次级按钮：便携版。描边而非实心，避免和主按钮抢注意力 */
      .cta.is-secondary {
        background: rgba(255, 255, 255, 0.55);
        border-color: var(--line);
        color: var(--fg);
        box-shadow: none;
      }

      .cta.is-secondary .cta-label {
        font-size: 15px;
        font-weight: 500;
      }

      .cta.is-secondary .cta-meta {
        opacity: 1;
        color: var(--muted);
        font-size: 11.5px;
      }

      .cta.is-secondary .dot {
        background: var(--accent);
        box-shadow: none;
        animation: none;
        opacity: 0.7;
      }

      .cta.is-secondary:hover {
        border-color: var(--accent);
        background: #ffffff;
        box-shadow: 0 8px 24px rgba(15, 118, 110, 0.1);
      }

      /* 未上线状态：链接还是 "#" 时由脚本挂上。
         保留品牌渐变，只关掉交互与脉冲，避免用户误以为能点。 */
      .cta.is-pending,
      .cta.is-pending:hover,
      .cta.is-pending:active {
        cursor: default;
        transform: none;
        filter: none;
        box-shadow: 0 8px 22px rgba(15, 118, 110, 0.18);
      }

      .cta.is-pending .dot {
        animation: none;
        opacity: 0.55;
      }

      .hint {
        margin: 14px 0 0;
        color: var(--faint);
        font-size: 12.5px;
        letter-spacing: 0.02em;
      }

      /* ── 下载量读数 ───────────────────────────── */
      .stat {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 8px;
        margin: 22px 0 0;
      }

      /* 没有数据时整块收起，避免出现「— 次下载」 */
      .stat[hidden] {
        display: none;
      }

      .stat-num {
        font: 600 26px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
        color: var(--accent);
      }

      .stat-label {
        color: var(--faint);
        font-size: 12px;
        letter-spacing: 0.14em;
      }

      .rule {
        height: 1px;
        margin: 34px 0 16px;
        border: 0;
        background: var(--line);
      }

      /* ── 问题反馈 ─────────────────────────────── */
      .feedback {
        margin: 0;
        color: var(--faint);
        font-size: 12.5px;
        line-height: 1.7;
        letter-spacing: 0.02em;
      }

      .feedback a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid rgba(11, 122, 106, 0.32);
        padding-bottom: 1px;
        transition: border-color 0.18s var(--ease);
      }

      .feedback a:hover,
      .feedback a:focus-visible {
        border-bottom-color: var(--accent);
      }

      .feedback a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 2px;
      }

      footer {
        margin-top: 10px;
        color: var(--faint);
        font-size: 12px;
        letter-spacing: 0.08em;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      @keyframes drift {
        to {
          transform: translate3d(4vmax, -3vmax, 0) scale(1.08);
        }
      }

      @media (max-width: 640px) {
        main {
          padding: 44px 24px 32px;
          border-radius: 22px;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }
        main {
          width: 100%;
          padding: 38px 20px 28px;
        }
        .cta {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before,
        body::after,
        .dot {
          animation: none;
        }
        .cta {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">Saya</p>
      <h1>HeartResonance</h1>

      <!-- 简介：想改文案就改这一段 -->
      <p class="about">
        Heart Resonance 是一款基于 TouchPlayer 的互动心脏视觉软件。实时 3D
        心脏会随音乐节奏跳动、缩放和发光，并联动心电波形（需要支持心率广播功能的手环/手表设备）与鼠标视差/旋转交互；支持本地歌单、整机声音侦听、主题和键位切换。
      </p>

      <!-- ════════════════════════════════════════════════
           发新版本时改这里：两个 href、两处 cta-meta。
           若把 href 改回 "#"，该按钮会自动降级为「即将开放」（不可点）。
           ════════════════════════════════════════════════ -->
      <div class="cta-group">
        <a
          class="cta"
          id="download"
          href="https://dl.eris.studio/HeartResonance_v1.0.0.zip"
          data-key="full"
          aria-label="下载完整版 HeartResonance，822 MB"
        >
          <span class="cta-label"><span class="dot"></span>下载</span>
          <span class="cta-meta">完整版 · v1.0.0 · 822 MB</span>
        </a>

        <a
          class="cta is-secondary"
          href="https://dl.eris.studio/HeartResonance_v1.0.0_NoInstaller.zip"
          data-key="portable"
          aria-label="下载便携版 HeartResonance，44 MB"
        >
          <span class="cta-label"><span class="dot"></span>便携版</span>
          <span class="cta-meta">v1.0.0 · 44 MB · 需已装 TouchPlayer</span>
        </a>
      </div>

      <!-- 平台说明：按实际情况修改 -->
      <p class="hint">Windows 10 / 11 · 64 位</p>

      <!-- 下载量：数据来自自建 Worker，未配置时整块隐藏 -->
      <p class="stat" id="stat" hidden>
        <span class="stat-num" id="download-count">0</span>
        <span class="stat-label">累计下载</span>
      </p>


      <hr class="rule" />
      <p class="feedback">
        遇到问题？发邮件到
        <!-- 邮箱拆成两段由脚本拼装：Cloudflare 的邮箱混淆会把明文 mailto 替换成 [email protected] -->
        <a class="mail" data-user="2932359175" data-domain="qq.com">发邮件反馈</a>
      </p>
      <footer>HeartResonance · saya.eris.studio</footer>
    </main>

    <script>
      // ══════════════════════════════════════════════════════════
      // 下载计数：填上自建 Worker 地址即可启用，留空则整块隐藏。
      // 例：const COUNTER_API = "https://count.eris.studio";
      // ══════════════════════════════════════════════════════════
      const COUNTER_API = "";

      // 1. 链接未就绪时降级
      document.querySelectorAll("a.cta").forEach((el) => {
        const url = (el.getAttribute("href") || "").trim();
        if (!url || url === "#") {
          el.classList.add("is-pending");
          el.removeAttribute("href");
          el.setAttribute("aria-disabled", "true");
          el.setAttribute("tabindex", "-1");
        }
      });

      // 2. 点击打点 + 读取总数
      (() => {
        const stat = document.getElementById("stat");
        const out = document.getElementById("download-count");
        if (!COUNTER_API || !stat || !out) return;

        const paint = (n) => {
          if (!n) return; // 0 就保持隐藏，不显示「0 次下载」
          out.textContent = n.toLocaleString("en-US");
          stat.hidden = false;
        };

        fetch(COUNTER_API + "/count", { cache: "no-store" })
          .then((r) => (r.ok ? r.json() : null))
          .then((j) => j && paint(j.total))
          .catch(() => {
            /* 计数服务不可用：静默隐藏，不影响下载 */
          });

        document.querySelectorAll("a.cta[data-key]").forEach((el) => {
          el.addEventListener("click", () => {
            const url = COUNTER_API + "/hit?key=" + encodeURIComponent(el.dataset.key);
            // keepalive 保证下载跳转后请求仍能发出去
            fetch(url, { keepalive: true }).catch(() => {});
          });
        });
      })();

      // 3. 反馈邮箱：运行时拼出 mailto，绕开 Cloudflare 的邮箱地址混淆
      (() => {
        const link = document.querySelector("a.mail");
        if (!link) return;
        const addr = link.dataset.user + "@" + link.dataset.domain;
        link.href =
          "mailto:" + addr + "?subject=" + encodeURIComponent("HeartResonance 问题反馈");
        link.textContent = addr;
      })();
    </script>
  </body>
</html>
