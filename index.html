<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saya</title>
    <meta name="description" content="Saya 的小程序，敬请期待。" />
    <meta name="theme-color" content="#0b0b0f" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0f;
        --fg: #f4f2f7;
        --muted: #9b97a6;
        --line: rgba(255, 255, 255, 0.12);
        --accent: #c9a7ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 60vmax;
        height: 60vmax;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.22;
        pointer-events: none;
      }

      body::before {
        background: #7c5cff;
        top: -30vmax;
        left: -20vmax;
      }

      body::after {
        background: #ff6fae;
        bottom: -35vmax;
        right: -20vmax;
      }

      main {
        position: relative;
        width: min(560px, 100%);
        padding: 56px 32px;
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(18px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }

      .mark {
        margin: 0 0 28px;
        color: var(--accent);
        font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(26px, 5vw, 38px);
        line-height: 1.25;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.8;
      }

      .soon {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 34px;
        padding: 12px 22px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--fg);
        font-size: 14px;
        text-decoration: none;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
      }

      footer {
        margin-top: 40px;
        color: #6f6b7a;
        font-size: 12px;
        letter-spacing: 0.08em;
      }

      @media (prefers-reduced-motion: no-preference) {
        .dot {
          animation: pulse 2.4s ease-in-out infinite;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">Saya</p>
      <h1>小程序正在制作中</h1>
      <p>做好之后，下载入口会出现在这里。</p>

      <!-- 下载上线后，把下面这行替换成：
           <a class="soon" href="你的下载链接"><span class="dot"></span>下载小程序</a> -->
      <span class="soon"><span class="dot"></span>敬请期待</span>

      <footer>saya.eris.studio</footer>
    </main>
  </body>
</html>
